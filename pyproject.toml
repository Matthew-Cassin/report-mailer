[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "report-mailer"
version = "1.0.0"
description = "Format and email the reports my other tools produce: auto-detects data-quality and scrape report JSON, sends HTML summaries via SMTP."
readme = "README.md"
license = "MIT"
authors = [{ name = "Matt" }]
requires-python = ">=3.10"
dependencies = [
    "click>=8.4.2,<9.0.0",
    "email-phone-validator @ git+https://github.com/Matthew-Cassin/email-phone-validator.git@v0.1.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Environment :: Console",
    "Topic :: Communications :: Email",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["email", "automation", "smtp", "reporting", "html-email", "data-quality"]

[project.urls]
Homepage = "https://github.com/Matthew-Cassin/report-mailer"
Repository = "https://github.com/Matthew-Cassin/report-mailer"
Issues = "https://github.com/Matthew-Cassin/report-mailer/issues"

[project.scripts]
report-mailer = "report_mailer.cli:send"

[project.optional-dependencies]
dev = [
    "ruff>=0.16",
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
report_mailer = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["report_mailer"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

# python_version intentionally unset: mypy then targets whatever interpreter
# runs it, matching each CI matrix leg.
[tool.mypy]
strict = true

# email-phone-validator is still pinned to its pre-1.0 tag (no py.typed
# yet) -- bump this override away once the pin below is updated to
# >=v1.0.0.
[[tool.mypy.overrides]]
module = ["email_phone_validator.*"]
ignore_missing_imports = true
